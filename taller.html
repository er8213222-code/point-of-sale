<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Taconazo - Taller</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#111;
}

header{
    background:#111;
    color:#ffd400;
    text-align:center;
    padding:16px;
    font-size:30px;
    font-weight:900;
}

.contenedor{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.tipo{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.tipo button{
    flex:1;
    padding:15px;
    border:0;
    border-radius:12px;
    background:white;
    font-size:20px;
    font-weight:900;
}

.tipo button.activo{
    background:#ffd400;
}

.mesa{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:18px;
}

.mesa label{
    display:block;
    font-size:20px;
    font-weight:900;
    margin-bottom:8px;
}

.mesa input{
    width:100%;
    padding:14px;
    border:2px solid #111;
    border-radius:10px;
    font-size:24px;
    font-weight:900;
}

h2{
    font-size:25px;
    margin:20px 0 10px;
}

.producto{
    background:white;
    border-radius:15px;
    padding:14px;
    margin-bottom:12px;
}

.producto-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.nombre{
    font-size:23px;
    font-weight:900;
}

.precio{
    font-size:18px;
    font-weight:bold;
    margin-top:3px;
}

.cantidad{
    width:105px;
    padding:11px;
    border:2px solid #111;
    border-radius:10px;
    font-size:23px;
    font-weight:900;
    text-align:center;
}

.modificaciones{
    display:none;
    margin-top:12px;
    padding-top:10px;
    border-top:2px solid #eee;
    gap:8px;
    flex-wrap:wrap;
}

.modificaciones button{
    padding:10px 13px;
    border:2px solid #111;
    border-radius:9px;
    background:white;
    font-weight:900;
}

.modificaciones button.seleccionado{
    background:#ffd400;
}

.resumen{
    background:#111;
    color:white;
    border-radius:15px;
    padding:18px;
    margin-top:20px;
}

.resumen-titulo{
    color:#ffd400;
    font-size:24px;
    font-weight:900;
    margin-bottom:8px;
}

#listaPedido{
    font-size:20px;
    line-height:1.7;
}

.total{
    margin-top:10px;
    font-size:25px;
    font-weight:900;
}

.enviar{
    width:100%;
    margin-top:15px;
    padding:19px;
    border:0;
    border-radius:14px;
    background:#e30613;
    color:white;
    font-size:25px;
    font-weight:900;
}

.limpiar{
    width:100%;
    margin-top:9px;
    padding:13px;
    border:2px solid #111;
    border-radius:12px;
    background:white;
    font-size:17px;
    font-weight:900;
}

.mensaje{
    text-align:center;
    min-height:25px;
    margin-top:12px;
    font-weight:900;
}

.oculto{
    display:none;
}
</style>
</head>

<body>

<header>
🌮 EL TACONAZO
</header>

<div class="contenedor">

    <div class="tipo">
        <button id="btnMesa" class="activo" onclick="tipoMesa()">
            🪑 MESA
        </button>

        <button id="btnLlevar" onclick="tipoLlevar()">
            PARA LLEVAR
        </button>
    </div>

    <div class="mesa" id="cajaMesa">
        <label>NÚMERO DE MESA</label>
        <input
            id="numeroMesa"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="Ej. 5"
            oninput="actualizarResumen()"
        >
    </div>

    <h2>🌮 TACOS</h2>

    <!-- ADO -->
    <div class="producto">
        <div class="producto-cabecera">
            <div>
                <div class="nombre">ADO</div>
                <div class="precio">$17</div>
            </div>

            <input
                id="cantidadAdo"
                class="cantidad"
                type="number"
                min="0"
                value="0"
                inputmode="numeric"
                oninput="actualizarProducto('ado')"
            >
        </div>

        <div id="modAdo" class="modificaciones">
            <button onclick="seleccionarMod('ado','sin cilantro',this)">
                SIN CILANTRO
            </button>

            <button onclick="seleccionarMod('ado','sin cebolla',this)">
                SIN CEBOLLA
            </button>

            <button onclick="seleccionarMod('ado','s/v',this)">
                S/V
            </button>
        </div>
    </div>

    <!-- RES -->
    <div class="producto">
        <div class="producto-cabecera">
            <div>
                <div class="nombre">RES</div>
                <div class="precio">$17</div>
            </div>

            <input
                id="cantidadRes"
                class="cantidad"
                type="number"
                min="0"
                value="0"
                inputmode="numeric"
                oninput="actualizarProducto('res')"
            >
        </div>

        <div id="modRes" class="modificaciones">
            <button onclick="seleccionarMod('res','sin cilantro',this)">
                SIN CILANTRO
            </button>

            <button onclick="seleccionarMod('res','sin cebolla',this)">
                SIN CEBOLLA
            </button>

            <button onclick="seleccionarMod('res','s/v',this)">
                S/V
            </button>
        </div>
    </div>

    <h2>🥪 TORTAS</h2>

    <!-- TORTA ADO -->
    <div class="producto">
        <div class="producto-cabecera">
            <div>
                <div class="nombre">TORTA ADO</div>
                <div class="precio">$45</div>
            </div>

            <input
                id="cantidadTortaAdo"
                class="cantidad"
                type="number"
                min="0"
                value="0"
                inputmode="numeric"
                oninput="actualizarProducto('tortaAdo')"
            >
        </div>

        <div id="modTortaAdo" class="modificaciones">
            <button onclick="seleccionarMod('tortaAdo','sin cilantro',this)">
                SIN CILANTRO
            </button>

            <button onclick="seleccionarMod('tortaAdo','sin cebolla',this)">
                SIN CEBOLLA
            </button>

            <button onclick="seleccionarMod('tortaAdo','s/v',this)">
                S/V
            </button>
        </div>
    </div>

    <!-- TORTA RES -->
    <div class="producto">
        <div class="producto-cabecera">
            <div>
                <div class="nombre">TORTA RES</div>
                <div class="precio">$45</div>
            </div>

            <input
                id="cantidadTortaRes"
                class="cantidad"
                type="number"
                min="0"
                value="0"
                inputmode="numeric"
                oninput="actualizarProducto('tortaRes')"
            >
        </div>

        <div id="modTortaRes" class="modificaciones">
            <button onclick="seleccionarMod('tortaRes','sin cilantro',this)">
                SIN CILANTRO
            </button>

            <button onclick="seleccionarMod('tortaRes','sin cebolla',this)">
                SIN CEBOLLA
            </button>

            <button onclick="seleccionarMod('tortaRes','s/v',this)">
                S/V
            </button>
        </div>
    </div>

    <h2>🥤 BEBIDAS</h2>

    <div class="producto">
        <div class="producto-cabecera">
            <div class="nombre">COCA <span class="precio">$25</span></div>
            <input id="cantidadCoca" class="cantidad" type="number" min="0" value="0" inputmode="numeric" oninput="actualizarResumen()">
        </div>
    </div>

    <div class="producto">
        <div class="producto-cabecera">
            <div class="nombre">SPRITE <span class="precio">$25</span></div>
            <input id="cantidadSprite" class="cantidad" type="number" min="0" value="0" inputmode="numeric" oninput="actualizarResumen()">
        </div>
    </div>

    <div class="producto">
        <div class="producto-cabecera">
            <div class="nombre">FANTA <span class="precio">$25</span></div>
            <input id="cantidadFanta" class="cantidad" type="number" min="0" value="0" inputmode="numeric" oninput="actualizarResumen()">
        </div>
    </div>

    <div class="producto">
        <div class="producto-cabecera">
            <div class="nombre">AGUA MINERAL <span class="precio">$25</span></div>
            <input id="cantidadAgua" class="cantidad" type="number" min="0" value="0" inputmode="numeric" oninput="actualizarResumen()">
        </div>
    </div>

    <div class="producto">
        <div class="producto-cabecera">
            <div class="nombre">CERVEZA <span class="precio">$25</span></div>
            <input id="cantidadCerveza" class="cantidad" type="number" min="0" value="0" inputmode="numeric" oninput="actualizarResumen()">
        </div>
    </div>

    <div class="resumen">

        <div class="resumen-titulo">
            PEDIDO
        </div>

        <div id="tipoResumen">
            MESA
        </div>

        <div id="listaPedido">
            Todavía no hay productos.
        </div>

        <div class="total" id="total">
            TOTAL: $0
        </div>

    </div>

    <button class="enviar" onclick="enviarPedido()">
        ENVIAR PEDIDO
    </button>

    <button class="limpiar" onclick="limpiarPedido()">
        LIMPIAR PEDIDO
    </button>

    <div id="mensaje" class="mensaje"></div>

</div>

<script>

const productos = {

    ado:{
        nombre:"ADO",
        precio:17,
        cantidad:"cantidadAdo",
        modificacion:"modAdo"
    },

    res:{
        nombre:"RES",
        precio:17,
        cantidad:"cantidadRes",
        modificacion:"modRes"
    },

    tortaAdo:{
        nombre:"TORTA ADO",
        precio:45,
        cantidad:"cantidadTortaAdo",
        modificacion:"modTortaAdo"
    },

    tortaRes:{
        nombre:"TORTA RES",
        precio:45,
        cantidad:"cantidadTortaRes",
        modificacion:"modTortaRes"
    },

    coca:{
        nombre:"COCA",
        precio:25,
        cantidad:"cantidadCoca"
    },

    sprite:{
        nombre:"SPRITE",
        precio:25,
        cantidad:"cantidadSprite"
    },

    fanta:{
        nombre:"FANTA",
        precio:25,
        cantidad:"cantidadFanta"
    },

    agua:{
        nombre:"AGUA MINERAL",
        precio:25,
        cantidad:"cantidadAgua"
    },

    cerveza:{
        nombre:"CERVEZA",
        precio:25,
        cantidad:"cantidadCerveza"
    }
};

let tipo = "mesa";

let modificaciones = {
    ado:null,
    res:null,
    tortaAdo:null,
    tortaRes:null
};

function tipoMesa(){

    tipo = "mesa";

    document.getElementById("btnMesa").classList.add("activo");
    document.getElementById("btnLlevar").classList.remove("activo");

    document.getElementById("cajaMesa").classList.remove("oculto");

    actualizarResumen();
}

function tipoLlevar(){

    tipo = "llevar";

    document.getElementById("btnLlevar").classList.add("activo");
    document.getElementById("btnMesa").classList.remove("activo");

    document.getElementById("cajaMesa").classList.add("oculto");

    actualizarResumen();
}

function actualizarProducto(id){

    const producto = productos[id];

    const input = document.getElementById(producto.cantidad);

    let cantidad = parseInt(input.value);

    if(isNaN(cantidad) || cantidad < 0){
        cantidad = 0;
    }

    input.value = cantidad;

    if(producto.modificacion){

        const caja = document.getElementById(producto.modificacion);

        if(cantidad > 0){

            /*
             * IMPORTANTE:
             * Se muestra inmediatamente cuando se escribe
             * la cantidad de ESTE producto.
             */
            caja.style.display = "flex";

        }else{

            caja.style.display = "none";

            modificaciones[id] = null;

            caja.querySelectorAll("button").forEach(boton=>{
                boton.classList.remove("seleccionado");
            });
        }
    }

    actualizarResumen();
}

function seleccionarMod(id,mod,boton){

    const producto = productos[id];

    const cantidad =
        parseInt(document.getElementById(producto.cantidad).value) || 0;

    if(cantidad <= 0){
        return;
    }

    modificaciones[id] =
        modificaciones[id] === mod ? null : mod;

    const caja =
        document.getElementById(producto.modificacion);

    caja.querySelectorAll("button").forEach(boton=>{
        boton.classList.remove("seleccionado");
    });

    if(modificaciones[id]){
        boton.classList.add("seleccionado");
    }

    actualizarResumen();
}

function actualizarResumen(){

    let html = "";
    let total = 0;
    let hay = false;

    if(tipo === "mesa"){

        const mesa =
            document.getElementById("numeroMesa").value;

        document.getElementById("tipoResumen").textContent =
            mesa ? "MESA " + mesa : "MESA — SIN NÚMERO";

    }else{

        document.getElementById("tipoResumen").textContent =
            "PARA LLEVAR";
    }

    for(const id in productos){

        const producto = productos[id];

        const cantidad =
            parseInt(document.getElementById(producto.cantidad).value) || 0;

        if(cantidad > 0){

            hay = true;

            let texto =
                cantidad + " " + producto.nombre;

            if(modificaciones[id]){
                texto += " (" + modificaciones[id] + ")";
            }

            html += "<div>" + texto + "</div>";

            total += cantidad * producto.precio;
        }
    }

    document.getElementById("listaPedido").innerHTML =
        hay ? html : "Todavía no hay productos.";

    document.getElementById("total").textContent =
        "TOTAL: $" + total;
}

function enviarPedido(){

    const mensaje =
        document.getElementById("mensaje");

    if(tipo === "mesa"){

        const mesa =
            document.getElementById("numeroMesa").value.trim();

        if(!mesa){

            mensaje.textContent =
                "Falta el número de mesa.";

            return;
        }
    }

    let hay = false;

    for(const id in productos){

        const producto = productos[id];

        const cantidad =
            parseInt(document.getElementById(producto.cantidad).value) || 0;

        if(cantidad > 0){
            hay = true;
            break;
        }
    }

    if(!hay){

        mensaje.textContent =
            "Agrega al menos un producto.";

        return;
    }

    mensaje.textContent =
        "Pedido listo para conectar con MAGIA.";

    setTimeout(()=>{
        mensaje.textContent = "";
    },3000);
}

function limpiarPedido(){

    for(const id in productos){

        const producto = productos[id];

        document.getElementById(producto.cantidad).value = 0;

        if(producto.modificacion){

            document.getElementById(producto.modificacion)
                .style.display = "none";

            document.getElementById(producto.modificacion)
                .querySelectorAll("button")
                .forEach(boton=>{
                    boton.classList.remove("seleccionado");
                });

            modificaciones[id] = null;
        }
    }

    document.getElementById("numeroMesa").value = "";

    actualizarResumen();

    document.getElementById("mensaje").textContent = "";
}

actualizarResumen();

</script>

</body>
                </html>
